<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pack Vault · OneClient</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0c0e17;color:#f4f1fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#33244d 0%,transparent 47%),#0c0e17}main{max-width:1100px;margin:auto;padding:52px 28px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}h1{font-size:clamp(38px,6vw,68px);letter-spacing:-.065em;margin:8px 0}h1 span{color:#bd95ff}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c7a6ff;font-weight:800}p{color:#aaa6bc}.folder{font-family:monospace;color:#a4a0b1;font-size:12px;overflow-wrap:anywhere;margin:0 0 36px}.pill{border:1px solid #40374f;border-radius:100px;padding:9px 16px;color:#d9c4ff;white-space:nowrap;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}input[type=search]{flex:1;min-width:200px;background:#1b1b2a;border:1px solid #393548;color:#fff;border-radius:13px;padding:14px 18px;font:inherit;outline:none}input:focus{border-color:#a77bf1}button,.import{background:#282536;border:1px solid #4b425e;color:#eee8fc;border-radius:13px;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;transition:.15s}button:hover,.import:hover{background:#45305f;border-color:#a77bf1}.import{background:#b98eff;border-color:#b98eff;color:#171025;display:inline-flex;align-items:center}.import:hover{background:#d0aeff}#upload{display:none}.stats{display:flex;gap:22px;margin-bottom:24px;color:#9e98ad;font-size:13px}.stats strong{color:#eee5ff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}.card{background:#1b1b29;border:1px solid #332f42;border-radius:21px;padding:20px;min-width:0;box-shadow:0 12px 35px #07071033}.card.off{opacity:.62}.top{display:flex;gap:16px;align-items:center}.icon{width:72px;height:72px;object-fit:cover;image-rendering:pixelated;border-radius:13px;background:#302b42;display:grid;place-items:center;color:#c6a5f6;font-size:30px;flex:none}.name{font-size:16px;font-weight:750;overflow-wrap:anywhere;margin:0 0 6px}.badge{font-size:11px;letter-spacing:.08em;color:#b9e8ce;text-transform:uppercase;font-weight:800}.off .badge{color:#b2aabb}.desc{height:43px;overflow:hidden;line-height:1.5;font-size:13px;margin:20px 0}.actions{display:flex;gap:9px;border-top:1px solid #332f42;padding-top:17px}.actions button{font-size:12px;padding:9px 12px}.empty{border:1px dashed #4a405d;border-radius:20px;padding:60px 24px;text-align:center;color:#aea2c1}.toast{position:fixed;bottom:25px;right:25px;background:#382950;border:1px solid #a584d2;border-radius:12px;padding:14px 20px;max-width:360px;box-shadow:0 20px 40px #0007}footer{margin-top:48px;font-size:12px;color:#777185}@media(max-width:600px){main{padding:35px 18px}header{display:block}.pill{display:inline-block;margin-bottom:20px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">OneClient / resourcepacks</div><h1>Pack <span>Vault.</span></h1><p>Your textures, in one place. No more digging through folders.</p></div><span class="pill">✦ local only</span></header>
<div class="folder" id="folder"></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search packs..."><button id="surprise">✦ Pick one</button><label class="import" for="upload">＋ Import ZIP</label><input id="upload" type="file" accept=".zip"></div>
<div class="stats" id="stats"></div><div class="grid" id="grid"></div>
<footer>Backups live next to your resourcepacks folder. Disabling a ZIP renames it to .zip.disabled; it does not change Minecraft's saved pack selection.</footer>
</main><script>
let packs=[];const grid=document.querySelector('#grid'),search=document.querySelector('#search');
function toast(message){let el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),3500)}
async function request(path,body){let response=await fetch(path,{method:body===undefined?'GET':'POST',body});let data=await response.json();if(!response.ok)throw Error(data.error||'Something went wrong');return data}
async function refresh(){try{let data=await request('/api/packs');packs=data.packs;document.querySelector('#folder').textContent=data.folder;render()}catch(e){toast(e.message)}}
function render(){let term=search.value.toLowerCase(),filtered=packs.filter(p=>(p.name+' '+p.description).toLowerCase().includes(term));document.querySelector('#stats').innerHTML=`<span><strong>${packs.length}</strong> packs</span><span><strong>${packs.filter(p=>p.enabled).length}</strong> available</span>`;grid.replaceChildren();if(!filtered.length){let empty=document.createElement('div');empty.className='empty';empty.textContent=packs.length?'No matches. Try another search.':'No packs yet. Import a ZIP to get started.';grid.append(empty);return}for(let pack of filtered){let card=document.createElement('article');card.className='card'+(pack.enabled?'':' off');let top=document.createElement('div');top.className='top';let icon=pack.icon?document.createElement('img'):document.createElement('div');icon.className='icon';if(pack.icon){icon.src='/api/icon?name='+encodeURIComponent(pack.name);icon.alt='Pack icon'}else icon.textContent='✦';let title=document.createElement('div'),name=document.createElement('div'),badge=document.createElement('div');name.className='name';name.textContent=pack.name.replace(/\.zip(\.disabled)?$/i,'');badge.className='badge';badge.textContent=pack.enabled?'● Available':'○ Disabled';title.append(name,badge);top.append(icon,title);let desc=document.createElement('p');desc.className='desc';desc.textContent=pack.description;let actions=document.createElement('div');actions.className='actions';if(pack.kind==='zip'){let toggle=document.createElement('button');toggle.textContent=pack.enabled?'Disable':'Enable';toggle.onclick=()=>act('toggle',pack.name);actions.append(toggle)}let backup=document.createElement('button');backup.textContent='↗ Backup';backup.onclick=()=>act('backup',pack.name);actions.append(backup);card.append(top,desc,actions);grid.append(card)}}
async function act(action,name){try{let result=await request('/api/'+action+'?name='+encodeURIComponent(name),new Uint8Array());toast(action==='backup'?'Saved to '+result.backup:'Updated '+name);await refresh()}catch(e){toast(e.message)}}
document.querySelector('#upload').onchange=async event=>{let file=event.target.files[0];if(!file)return;try{if(file.size>128*1024*1024)throw Error('Maximum size is 128 MB');await request('/api/import?name='+encodeURIComponent(file.name),file);toast('Imported '+file.name);await refresh()}catch(e){toast(e.message)}event.target.value=''};
document.querySelector('#surprise').onclick=()=>{let enabled=packs.filter(p=>p.enabled);if(!enabled.length)return toast('No available packs yet');search.value=enabled[Math.floor(Math.random()*enabled.length)].name;render();toast('Your pick: '+search.value)};search.oninput=render;refresh();
</script></body></html>
